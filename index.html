<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live 3D</title>
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --line:#d8dde5; --text:#1b2230; --muted:#5d6878;
  --accent:#2563eb; --accent-ink:#ffffff; --chip:#f3f5f8; --chip-hover:#e8edf5;
  --danger:#c62828; --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --panel:#1c2027; --line:#2e343e; --text:#e7eaf0; --muted:#9aa4b2;
    --accent:#6b98ff; --accent-ink:#0b1020; --chip:#252a33; --chip-hover:#2e3440; --danger:#f87171;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#14171c; --panel:#1c2027; --line:#2e343e; --text:#e7eaf0; --muted:#9aa4b2;
  --accent:#6b98ff; --accent-ink:#0b1020; --chip:#252a33; --chip-hover:#2e3440; --danger:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh;overflow:hidden}
button,input,select{font:inherit;color:inherit}
svg{display:block}

.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-right:6px}
.brand b{color:var(--accent)}
.brand .logo{display:block;width:37px;height:32px;padding:2px 3px;background:#fff;border-radius:8px;box-sizing:content-box}
.grp{display:flex;gap:2px;padding:2px;background:var(--chip);border-radius:10px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--chip-hover)}
.btn:focus-visible,.tile:focus-visible,.act:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn svg{width:18px;height:18px;flex:none}
.btn.solo{border-color:var(--line);background:var(--panel)}
.btn[aria-pressed="true"]{background:var(--panel);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.08);color:var(--accent)}
.btn:disabled{opacity:.38;cursor:default;background:transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}

main{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:0}
#tray{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:6px 10px 16px;scrollbar-width:thin}
#tray.drop{box-shadow:inset 0 0 0 2px var(--danger)}
#tray details{border-bottom:1px solid var(--line);padding:6px 0 8px}
#tray summary{cursor:pointer;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--muted);padding:6px 2px;list-style:none;display:flex;align-items:center;gap:6px}
#tray summary::-webkit-details-marker{display:none}
#tray summary::before{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin:0 2px}
#tray details[open] summary::before{transform:rotate(45deg)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px 6px;border:1px solid transparent;border-radius:9px;background:var(--chip);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.15;min-width:0}
.tile:hover{border-color:var(--accent)}
.tile img{width:72px;height:72px;display:block}
.tray-hint{font-size:12px;color:var(--muted);margin:8px 2px 0}

#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:#eef3f8}
#view3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-100%);background:rgba(255,255,255,.92);color:#1f2937;border:1px solid #cbd5e1;border-radius:7px;padding:2px 7px;font-size:12.5px;font-weight:700;white-space:nowrap}
#views{position:absolute;right:14px;top:14px;z-index:5;display:flex;flex-direction:column;gap:6px}
.vbtn{display:flex;align-items:center;justify-content:center;gap:6px;min-width:44px;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:var(--shadow);cursor:pointer;font-size:12.5px;font-weight:700}
.vbtn:hover{background:var(--chip-hover)}
.vbtn svg{width:18px;height:18px}
#actionbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px 8px;max-width:calc(100% - 140px);display:flex;flex-direction:column;gap:6px}
.abhead{font-weight:800;font-size:13.5px;text-align:center}
.acts{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.act{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 9px;border:0;border-radius:8px;background:transparent;cursor:pointer;font-size:12.5px;font-weight:600}
.act:hover{background:var(--chip-hover)}
.act svg{width:18px;height:18px}
.act.danger{color:var(--danger)}
.slider{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;padding:0 6px}
.slider input{flex:1;min-width:140px;accent-color:var(--accent)}
.slider output{min-width:38px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.info{font-size:13px;text-align:center;border-top:1px solid var(--line);padding-top:6px;font-variant-numeric:tabular-nums}
#world{position:absolute;left:14px;bottom:14px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px 10px;font-size:13px;font-weight:600}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;font-weight:700;color:#475569;background:#eef3f8;z-index:6;text-align:center;padding:20px}

dialog{border:0;border-radius:16px;padding:0;background:var(--panel);color:var(--text);box-shadow:var(--shadow);width:min(540px,calc(100% - 32px))}
dialog::backdrop{background:rgba(10,15,25,.45)}
#dlgForm{padding:22px}
dialog h2{margin:0 0 6px;font-size:19px}
dialog h3{margin:0 0 4px;font-size:14px}
dialog p{margin:0 0 12px;color:var(--muted)}
dialog label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
dialog input,dialog select{width:100%;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
dialog menu{display:flex;justify-content:flex-end;gap:8px;margin:18px 0 0;padding:0;flex-wrap:wrap}
dialog .btn{border-color:var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.two section{background:var(--chip);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.two section p{margin:0;font-size:13px}
.two .btn{justify-content:center;margin-top:auto}
.row{display:flex;gap:8px}.row>*{flex:1}
.code{font:700 38px/1.1 ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:.14em;text-align:center;padding:14px;background:var(--chip);border-radius:12px;margin:8px 0 14px}
.people{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.person{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--chip);font-size:13px;font-weight:600}
.saves{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.saveopt{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--chip);cursor:pointer}
.saveopt:hover{border-color:var(--accent)}
.saveopt span{font-size:12.5px;color:var(--muted)}
.help li{margin:0 0 6px}.help ul{padding-left:18px;margin:0 0 8px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#111827;color:#fff;padding:10px 16px;border-radius:99px;font-size:13.5px;font-weight:600;transition:.2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:900px){.lbl{display:none}.btn{padding:0 8px}}
@media (max-width:720px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 168px}
  #tray{order:2;border-right:0;border-top:1px solid var(--line)}
  .tiles{grid-template-columns:repeat(4,1fr)}
  .two,.saves{grid-template-columns:1fr}
  #actionbar{max-width:calc(100% - 80px)}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

/* ---------- drawing the pieces ---------- */
const objs = {}, pickables = [];
function faceColor(sd, fi){

}
function buildSolid(it){

  sd.faces.forEach((f, fi) => {
    const pts = f.vi.map(i => sd.verts[i]), pos = [];

    const mat = new THREE.MeshStandardMaterial({ color:faceColor(sd, fi), side:THREE.DoubleSide, roughness:.65, metalness:0, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1 });

    const seg = [];

      const b = f.vi[(k + 1) % f.vi.length], e = sd.edges.find(q => (q.a === a && q.b === b) || (q.a === b && q.b === a));
      const other = e ? (e.f[0] === fi ? e.f[1] : e.f[0]) : -1;
      if (other >= 0 && sd.curved && !sd.isCap(fi) && !sd.isCap(other)) return;

    });

}
// swing every face about its hinge: u = 0 the solid, u = 1 the flat net on the floor
function applyUnfold(g, u){
  const { sd, faceObjs } = g.userData, M = [];
  for (const f of sd.order){
    if (sd.parent[f] < 0) M[f] = new THREE.Matrix4();
    else {

      const m = new THREE.Matrix4().makeTranslation(h.a[0], h.a[1], h.a[2]).multiply(new THREE.Matrix4().makeRotationAxis(h.axis, h.ang*u)).multiply(new THREE.Matrix4().makeTranslation(-h.a[0], -h.a[1], -h.a[2]));

}
function buildBlock(it){

  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color:c, roughness:.55, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1 }));
  mesh.userData.id = it.id; pickables.push(mesh);

  g.add(mesh, line);
  g.userData = { key:'b' + it.t + (it.o || 0) + (it.sw ? 1 : 0) + (it.neg ? 1 : 0) };
  return g;
}
function shapeKey(it){ return it.k === 'solid' ? it.s + '|' + it.bottom + '|' + (it.t || 0).toFixed(3) : 'b' + it.t + (it.o || 0) + (it.sw ? 1 : 0) + (it.neg ? 1 : 0); }
function disposeObj(g){
  g.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); const k = pickables.indexOf(o); if (k >= 0) pickables.splice(k, 1); });

function sync(){
  for (const id in objs) if (!S.items[id]){ disposeObj(objs[id]); delete objs[id]; }

    let g = objs[it.id];
    if (g && g.userData.key !== shapeKey(it)){ disposeObj(g); g = null; }
    if (!g){ g = it.k === 'solid' ? buildSolid(it) : buildBlock(it); objs[it.id] = g; scene.add(g); }
    if (it.k === 'solid'){

}

/* ---------- changes, undo, saving ---------- */
let undoS = [], redoS = [];
const begin = () => structuredClone(S.items);
function commit(pre){
  const ch = [];
  for (const id of new Set([...Object.keys(pre), ...Object.keys(S.items)])){
    const a = pre[id] || null, b = S.items[id] || null;
    if (JSON.stringify(a) !== JSON.stringify(b)) ch.push([id, a, b && structuredClone(b)]);
  }
  if (ch.length){ undoS.push(ch); if (undoS.length > 80) undoS.shift(); redoS = []; }
  undoBtns();
}
const act = fn => { const pre = begin(); fn(); commit(pre); };
function replay(ch, back){ const sets = [], dels = []; for (const [id, a, b] of ch){ const v = back ? a : b; if (v) sets.push(structuredClone(v)); else dels.push(id); } put(sets); drop(dels); }
function undo(){ const ch = undoS.pop(); if (!ch) return; replay(ch, true); redoS.push(ch); undoBtns(); }
function redo(){ const ch = redoS.pop(); if (!ch) return; replay(ch, false); undoS.push(ch); undoBtns(); }
function undoBtns(){ $('#undoBtn').disabled = !undoS.length; $('#redoBtn').disabled = !redoS.length; }
let saveT = 0;
const save = () => { clearTimeout(saveT); saveT = setTimeout(() => ls.set('l3d-world-v1', JSON.stringify(Object.values(S.items))), 400); };
let syncQ = 0;
const dirty = () => { if (!syncQ) syncQ = requestAnimationFrame(() => { syncQ = 0; sync(); }); };
function put(list, send = true){ if (!list.length) return; for (const it of list) S.items[it.id] = it; if (send) bcast({ t:'set', items:list }); dirty(); save(); }
function drop(ids, send = true){ ids = ids.filter(id => S.items[id]); if (!ids.length) return; for (const id of ids){ delete S.items[id]; if (S.sel === id) S.sel = null; } if (send) bcast({ t:'del', ids }); dirty(); save(); }
const snap = v => Math.round(v*4)/4;   // a quarter of a grid square

// anything that arrives from a link, a file or a partner is rebuilt from known fields only
function clean(o){
  if (!o || typeof o !== 'object') return null;
  const id = String(o.id || ''); if (!/^[\w-]{1,40}$/.test(id)) return null;
  if (o.k === 'solid'){
    if (!Object.prototype.hasOwnProperty.call(SHAPES, o.s)) return null;
    const b = baseOf(o.s), it = { id, k:'solid', s:o.s, x:num(o.x, 0, -19, 19), z:num(o.z, 0, -19, 19), ry:num(o.ry, 0, -100, 100) };
    it.bottom = Math.round(num(o.bottom, b.bottom, 0, b.planes.length - 1));
    it.t = num(o.t, 0, 0, truncMax(o.s)); it.u = num(o.u, 0, 0, 1);
    return it;
  }
  if (o.k === 'block'){
    if (!Object.prototype.hasOwnProperty.call(AB, o.t)) return null;
    const it = { id, k:'block', t:o.t, o:Math.round(num(o.o, 0, 0, 2)), x:num(o.x, 0, -19, 19), y:num(o.y, 0, 0, 40), z:num(o.z, 0, -19, 19) };

function loadAll(list){ S.items = {}; S.sel = null; for (const o of list.slice(0, 500)){ const it = clean(o); if (it) S.items[it.id] = it; } dirty(); save(); }

/* ---------- placing, picking and dragging ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function aim(e){ const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left)/r.width*2 - 1, -(e.clientY - r.top)/r.height*2 + 1); ray.setFromCamera(ndc, camera); }
function floorAt(e, y = 0){ aim(e); const p = new THREE.Vector3(); return ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), -y), p) ? p : null; }

// a block sits on the floor or on top of the highest block under it
function stackY(it, x, z, skip = new Set()){
  const [w, d] = blockDims(it); let y = 0;
  for (const o of Object.values(S.items)){
    if (o.k !== 'block' || o.id === it.id || skip.has(o.id)) continue;
    const [ow, od, oh] = blockDims(o);
    if (x < o.x + ow - 1e-6 && x + w > o.x + 1e-6 && z < o.z + od - 1e-6 && z + d > o.z + 1e-6) y = Math.max(y, o.y + oh);
  }

}
function newItem(pid, at){
  const id = ME.id.slice(1, 5) + rid();
  if (pid.startsWith('ab-')){
    const it = { id, k:'block', t:pid.slice(3), o:0, x:0, y:0, z:0 }, [w, , d] = blockDims(it);
    it.x = snap(at.x - w/2); it.z = snap(at.z - d/2); it.y = stackY(it, it.x, it.z);

  }
  return { id, k:'solid', s:pid, x:snap(at.x), z:snap(at.z), ry:0, bottom:baseOf(pid).bottom, t:0, u:0 };
}
const overTray = e => { const r = $('#tray').getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom; };
let D = null, pend = new Set(), pendT = 0;
function sendLater(id){ pend.add(id); if (!pendT) pendT = setTimeout(flush, 50); }
function flush(){ clearTimeout(pendT); pendT = 0; const l = [...pend].map(i => S.items[i]).filter(Boolean); pend.clear(); if (l.length) bcast({ t:'set', items:l }); }

canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0 || D) return;
  const id = pickAt(e);
  if (!id){ D = { mode:'empty', sx:e.clientX, sy:e.clientY }; return; }
  // grabbing a piece: the camera holds still while it moves
  controls.enabled = false;
  S.sel = id; dirty();
  const it = S.items[id], y = it.k === 'block' ? it.y : 0, p = floorAt(e, y);
  D = { mode:'move', id, pre:begin(), start:p, ox:it.x, oz:it.z, moved:false, sx:e.clientX, sy:e.clientY };
}, { capture:true });
window.addEventListener('pointermove', e => {
  if (!D) return;
  if (D.mode === 'new'){
    if (!D.made){
      if (Math.hypot(e.clientX - D.sx, e.clientY - D.sy) < 6) return;
      const p = floorAt(e); if (!p) return;
      const it = newItem(D.pid, p); put([it]); S.sel = it.id; D.made = it.id; controls.enabled = false;
      D.mode = 'move'; D.id = it.id; D.start = floorAt(e, it.k === 'block' ? it.y : 0); D.ox = it.x; D.oz = it.z; D.moved = true; D.fromTray = true;
    }
    return;
  }
  if (D.mode !== 'move') return;
  const it = S.items[D.id]; if (!it || !D.start) return;
  const p = floorAt(e, it.k === 'block' ? it.y : 0); if (!p) return;
  if (!D.moved && Math.hypot(e.clientX - D.sx, e.clientY - D.sy) < 4) return;
  D.moved = true;
  it.x = snap(D.ox + p.x - D.start.x); it.z = snap(D.oz + p.z - D.start.z);

});
function endDrag(e){
  if (!D) return;
  const d = D; D = null; controls.enabled = true; $('#tray').classList.remove('drop');
  if (d.mode === 'empty'){ if (Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 4){ S.sel = null; dirty(); } return; }
  if (d.mode === 'new'){
    // a click on a tile: the piece appears where the camera is looking
    const r = canvas.getBoundingClientRect(), c = floorAt({ clientX:r.left + r.width/2, clientY:r.top + r.height/2 }) || new THREE.Vector3();
    const it = newItem(d.pid, { x:c.x + (Math.random() - .5)*2, z:c.z + (Math.random() - .5)*2 });
    put([it]); S.sel = it.id; commit(d.pre); return;
  }
  if (d.mode === 'move'){
    if (!d.moved) return;
    if (e && e.type === 'pointerup' && overTray(e)){ drop([d.id]); commit(d.pre); return; }

}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', e => { if (D && D.mode === 'new'){ D = null; return; } endDrag(e); });

const GROUPS = [
  { id:'reg',   name:'Regular solids', tiles:['tetra','cube','octa','dodeca','icosa'] },
  { id:'prism', name:'Prisms',         tiles:['prism3','prism4','prism5','prism6'] },
  { id:'pyr',   name:'Pyramids',       tiles:['pyr3','pyr4','pyr5','pyr6'] },
  { id:'round', name:'Cone and cylinder', tiles:['cone','cyl'] },
  { id:'blocks', name:'3D algebra blocks', tiles:Object.keys(AB).map(t => 'ab-' + t) }

const tileName = pid => pid.startsWith('ab-') ? AB[pid.slice(3)].t : SHAPES[pid].name;
// small pictures of each piece, drawn once by a second, off-screen 3D renderer
function thumbnails(){
  const size = 144, r2 = new THREE.WebGLRenderer({ antialias:true, alpha:true, preserveDrawingBuffer:true }); r2.setSize(size, size, false);
  const sc = new THREE.Scene(); sc.add(new THREE.HemisphereLight(0xffffff, 0x9aa4b2, 1.7)); const l = new THREE.DirectionalLight(0xffffff, 1.4); l.position.set(5, 9, 7); sc.add(l);
  const cam = new THREE.PerspectiveCamera(32, 1, 0.1, 100), out = {};
  for (const g of GROUPS) for (const pid of g.tiles){
    const it = pid.startsWith('ab-') ? { id:'t', k:'block', t:pid.slice(3), o:0, x:0, y:0, z:0 } : { id:'t', k:'solid', s:pid, x:0, z:0, ry:0, bottom:baseOf(pid).bottom, t:0, u:0 };
    const obj = it.k === 'solid' ? buildSolid(it) : buildBlock(it);
    if (it.k === 'block'){ const [w, d, h] = blockDims(it); obj.position.set(0, h/2, 0); }
    sc.add(obj);
    const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3()), rad = box.getSize(new THREE.Vector3()).length()/2;
    const dir = new THREE.Vector3(0.75, 0.62, 1).normalize(), dist = rad/Math.sin(THREE.MathUtils.degToRad(16));

  }

  return out;
}
function buildTray(){

    h += `<div class="acts">${abtn('flip','flip','Flip')}${abtn('turn','turn','Turn')}${abtn('tip','tip','Tip over')}${abtn('dup','dup','Copy')}${abtn('del','del','Delete','danger')}</div>`;
  }
  if (S.values) h += `<div class="info">${infoText(it)}</div>`;
  bar.innerHTML = h; bar.hidden = false;
}
function infoText(it){
  if (!S.values) return '';
  if (it.k === 'block') return 'Value: ' + (it.neg ? '−' : '') + AB[it.t].t;
  const sd = solidOf(it.s, it.bottom, it.t || 0);
  if (sd.curved){
    const caps = sd.faces.filter((f, i) => sd.isCap(i)).length;
    return `${caps} flat circular face${caps === 1 ? '' : 's'} and 1 curved surface${it.s === 'cone' && !(it.t > 0) ? ' · 1 vertex (the tip)' : ''}`;
  }
  return `Faces <b>${sd.F}</b> · Edges <b>${sd.E}</b> · Vertices <b>${sd.Vn}</b> &nbsp;→&nbsp; F + V − E = ${sd.F} + ${sd.Vn} − ${sd.E} = <b>${sd.F + sd.Vn - sd.E}</b>`;
}
let slidePre = null;
bar.addEventListener('input', e => {
  const r = e.target.closest('[data-slide]'); if (!r) return;
  const it = S.items[S.sel]; if (!it) return;
  if (!slidePre) slidePre = begin();
  it[r.dataset.slide] = +r.value/100;
  dirty(); sendLater(it.id);
});
bar.addEventListener('change', e => {
  if (!e.target.closest('[data-slide]') || !slidePre) return;
  flush(); const it = S.items[S.sel]; if (it) put([it]);
  commit(slidePre); slidePre = null;
});
bar.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const it = S.items[S.sel]; if (!it) return;
  const a = b.dataset.act;
  act(() => {
    if (a === 'del') drop([it.id]);
    else if (a === 'dup'){
      const n = structuredClone(it); n.id = ME.id.slice(1, 5) + rid(); n.x = snap(it.x + 2.5);
      if (n.k === 'block') n.y = stackY(n, n.x, n.z);
      put([n]); S.sel = n.id;
    } else if (a === 'turn'){
      if (it.k === 'solid') put([{ ...it, ry:((it.ry || 0) + Math.PI/4) % (2*Math.PI) }]);
      else { const n = { ...it }; if (n.sw) delete n.sw; else n.sw = true; n.y = stackY(n, n.x, n.z); put([n]); }
    } else if (a === 'tip'){ const n = { ...it, o:((it.o || 0) + 1) % 3 }; n.y = stackY(n, n.x, n.z); put([n]); }
    else if (a === 'flip'){ const n = { ...it }; if (n.neg) delete n.neg; else n.neg = true; put([n]); }
    else if (a === 'face'){
      // the next face of the solid goes on the floor: a different net
      const b0 = baseOf(it.s), sd = solidOf(it.s, it.bottom, it.t || 0), present = new Set(sd.faces.map(f => f.plane));
      let nb = it.bottom;
      for (let k = 1; k <= b0.planes.length; k++){ const c = (it.bottom + k) % b0.planes.length; if (present.has(c)){ nb = c; break; } }
      put([{ ...it, bottom:nb }]);
    }
  });
});

/* ---------- top bar ---------- */
function syncToggles(){ $('#namesBtn').setAttribute('aria-pressed', S.names); $('#valuesBtn').setAttribute('aria-pressed', S.values); }
$('#namesBtn').onclick = () => { S.names = !S.names; ls.set('l3d-names', S.names ? '1' : '0'); syncToggles(); dirty(); };
$('#valuesBtn').onclick = () => { S.values = !S.values; ls.set('l3d-values', S.values ? '1' : '0'); syncToggles(); barSig = ''; dirty(); if (S.values && !S.sel) toast('Select a solid to see its faces, edges and vertices.'); };
$('#undoBtn').onclick = undo; $('#redoBtn').onclick = redo;
window.addEventListener('keydown', e => {
  if ($('#dlg').open || (e.target.matches && e.target.matches('input,select,textarea'))) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && k === 'y'){ e.preventDefault(); redo(); }
  else if (!mod && (k === 'delete' || k === 'backspace') && S.sel){ e.preventDefault(); act(() => drop([S.sel])); }
  else if (!mod && k === 'escape'){ S.sel = null; dirty(); }
});

/* ---------- dialogs and messages ---------- */
const dlg = $('#dlg'), dlgForm = $('#dlgForm');
let dlgHandler = null;
function openDlg(html, handler){ dlgForm.innerHTML = html; dlgHandler = handler; if (!dlg.open) dlg.showModal(); const f = dlgForm.querySelector('[autofocus]'); if (f) f.focus(); }
dlgForm.addEventListener('submit', e => { const v = e.submitter ? e.submitter.value : 'ok'; if (dlgHandler && v !== 'cancel'){ if (dlgHandler(v, new FormData(dlgForm)) === false) e.preventDefault(); } });
dlg.addEventListener('close', () => { dlgHandler = null; dlg._together = false; });
dlgForm.addEventListener('click', e => { const c = e.target.closest('[data-copy]'); if (!c) return; const inp = dlgForm.querySelector(c.dataset.copy); navigator.clipboard.writeText(inp.value).then(() => c.textContent = 'Copied', () => { c.textContent = 'Select and copy'; inp.select(); }); });
let toastT = 0;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }

$('#clearBtn').onclick = () => openDlg(`<h2>Clear the world?</h2><p>This removes every piece${NET.conns.size ? ' for everyone in this world' : ''}. You can undo it.</p><menu><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="ok">Clear</button></menu>`,
  () => act(() => drop(Object.keys(S.items))));
$('#helpBtn').onclick = () => openDlg(`<h2>How to use Live 3D</h2><div class="help"><ul>
  <li><b>Add pieces:</b> drag them from the left into the world, or click one.</li>
  <li><b>Look around:</b> drag empty space to spin, right-drag (or two fingers) to slide, scroll or pinch to zoom. Use Home, Front, Top, Side and Fit on the right.</li>
  <li><b>Move a piece:</b> drag it along the floor. Blocks stack on top of other blocks. Drag a piece back to the left to remove it.</li>
  <li><b>Nets:</b> select a solid and move <b>Unfold</b> to open it flat into its net. <b>Next face down</b> stands it on another face, which gives a different net.</li>
  <li><b>Truncate:</b> cut off the corners of a polyhedron (or the tip of a cone). Truncated solids unfold too.</li>
  <li><b>Values:</b> shows faces, edges and vertices of the selected solid, and checks F + V − E = 2. For blocks it shows the expression.</li>
  <li><b>3D algebra blocks:</b> Flip for the negative side, Turn to swing it round, Tip over to stand it another way.</li>
  <li><b>Work together:</b> one person starts and gets a code; the partner types it. Each person moves their own camera; the pieces are shared.</li></ul></div>
  <menu><button class="btn primary" value="cancel">Got it</button></menu>`, null);

/* ---------- save: picture, file, link ---------- */
function download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }
const today = () => new Date().toISOString().slice(0, 10);
const b64u = bytes => { let s = ''; bytes.forEach(b => s += String.fromCharCode(b)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const unb64u = str => Uint8Array.from(atob(str.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
const compact = () => Object.values(S.items).map(i => { const o = { ...i }; for (const k of ['x','y','z','ry','t','u']) if (typeof o[k] === 'number') o[k] = Math.round(o[k]*1000)/1000; return o; });
async function encodeWorld(){
  const json = new TextEncoder().encode(JSON.stringify({ v:1, items:compact() }));
  if (window.CompressionStream){ const buf = await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer(); return 'z' + b64u(new Uint8Array(buf)); }
  return 'j' + b64u(json);
}
async function decodeWorld(s){
  let bytes = unb64u(s.slice(1));
  if (s[0] === 'z') bytes = new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
  return (JSON.parse(new TextDecoder().decode(bytes)).items || []).map(clean).filter(Boolean);
}
function baseUrl(){ const u = new URL(location.href); u.hash = ''; u.searchParams.delete('join'); return u; }
$('#saveBtn').onclick = () => openDlg(`<h2>Save your work</h2><div class="saves">
    <button class="saveopt" value="png"><b>Save as a picture</b><span>A PNG of what the camera shows.</span></button>
    <button class="saveopt" value="file"><b>Save a world file</b><span>Keep working later: open it again with the button below.</span></button>
    <button class="saveopt" value="open"><b>Open a world file</b><span>Load a world you saved. It replaces this one${NET.conns.size ? ' for everyone' : ''}.</span></button>
    <button class="saveopt" value="link"><b>Copy a world link</b><span>A link that opens this world, for slides or Google Classroom.</span></button></div>
  <p style="margin-top:12px;font-size:13px">This browser also keeps the world while you work.</p><menu><button class="btn" value="cancel">Close</button></menu>`,
  v => {
    if (v === 'png'){ S.sel = null; sync(); renderer.render(scene, camera); canvas.toBlob(b => { if (b){ download(b, `live-3d-${today()}.png`); toast('Picture saved.'); } }, 'image/png'); }
    else if (v === 'file'){ download(new Blob([JSON.stringify({ app:'live-3d', v:1, items:compact() })], { type:'application/json' }), `live-3d-world-${today()}.json`); toast('World file saved.'); }
    else if (v === 'open') $('#fileIn').click();
    else if (v === 'link') setTimeout(async () => {
      const u = baseUrl(); u.hash = 'w=' + await encodeWorld();
      openDlg(`<h2>World link</h2><p>This link opens the world as it is now. Each time it opens it starts fresh from this world.</p>
        <label for="linkOut">Link</label><div class="row"><input id="linkOut" readonly value="${esc(u.toString())}"><button type="button" class="btn" data-copy="#linkOut" style="flex:0 0 auto">Copy link</button></div>
        <menu><button class="btn primary" value="cancel">Done</button></menu>`, null);
    }, 0);
  });
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    if (!o || o.app !== 'live-3d' || !Array.isArray(o.items)) throw 0;
    const items = o.items.map(clean).filter(Boolean);
    act(() => { drop(Object.keys(S.items)); put(items); });
    toast('World opened.'); setView('fit');
  } catch(err){ toast('That file is not a Live 3D world.'); }
});

/* ---------- working together (peer to peer, no accounts; same as Edutorium Live) ---------- */
const NET = { peer:null, conns:new Set(), host:false, code:'', state:'off' }, peers = {};
let peerLib = null;
function loadPeer(){
  if (window.Peer) return Promise.resolve();
  if (!peerLib) peerLib = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'; s.onload = res; s.onerror = () => { peerLib = null; rej(); }; document.head.appendChild(s); });
  return peerLib;
}
const pid = code => 'edutorium-live3d-' + code.toLowerCase();
function genCode(){ const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 6; i++) s += A[Math.floor(Math.random()*A.length)]; return s; }
function bcast(m, except){ for (const c of NET.conns) if (c !== except && c.open){ try { c.send(m); } catch(e){} } }
const myName = () => ME.name || 'Partner';
function leave(silent){
  for (const c of NET.conns) try { c.close(); } catch(e){}
  NET.conns.clear(); if (NET.peer) try { NET.peer.destroy(); } catch(e){}
  NET.peer = null; NET.host = false; NET.code = ''; NET.state = 'off'; for (const k in peers) delete peers[k];
  netStatus(); if (!silent) toast('You are working on your own now.');
}
async function startHost(){
  leave(true); NET.host = true; NET.code = genCode(); NET.state = 'starting'; netStatus();
  try { await loadPeer(); } catch(e){ leave(true); toast('Working together needs an internet connection.'); return; }
  const p = new Peer(pid(NET.code), { debug:0 }); NET.peer = p;
  p.on('open', () => { NET.state = 'waiting'; netStatus(); if (dlg.open && dlg._together) showTogether(); });
  p.on('connection', c => { wire(c); c.on('open', () => { c.send({ t:'hello', id:ME.id, name:myName(), color:ME.color }); c.send({ t:'state', items:S.items }); for (const [id, q] of Object.entries(peers)) c.send({ t:'hello', id, name:q.name, color:q.color }); }); });
  p.on('error', err => { if (err.type === 'unavailable-id'){ startHost(); return; } if (!NET.conns.size){ leave(true); toast('Could not connect. Try again.'); } });
  p.on('disconnected', () => { try { if (!p.destroyed) p.reconnect(); } catch(e){} });
}
async function join(code){
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length !== 6){ toast('Codes have 6 letters and numbers.'); return; }
  leave(true); NET.host = false; NET.code = code; NET.state = 'joining'; netStatus();
  try { await loadPeer(); } catch(e){ leave(true); toast('Working together needs an internet connection.'); return; }
  const p = new Peer({ debug:0 }); NET.peer = p;
  p.on('open', () => { const c = p.connect(pid(code), { reliable:true, serialization:'json' }); wire(c); c.on('open', () => c.send({ t:'hello', id:ME.id, name:myName(), color:ME.color })); });
  p.on('error', err => { if (err.type === 'peer-unavailable'){ leave(true); toast(`No shared world with the code ${code}.`); return; } if (!NET.conns.size){ leave(true); toast('Could not connect. Try again.'); } });
}
function wire(c){
  c.on('open', () => { NET.conns.add(c); NET.state = 'live'; netStatus(); if (dlg.open && dlg._together) showTogether(); });
  c.on('data', m => onMsg(m, c));
  c.on('close', () => {
    NET.conns.delete(c);
    if (c._who){ const n = peers[c._who] ? peers[c._who].name : 'Your partner'; delete peers[c._who]; if (NET.host) bcast({ t:'bye', id:c._who }); toast(`${n} left.`); }
    if (!NET.host){ leave(true); toast('The shared world was closed. Your world is still here.'); } else { NET.state = NET.conns.size ? 'live' : 'waiting'; netStatus(); }
    if (dlg.open && dlg._together) showTogether();
  });
}
function onMsg(m, c){
  if (!m || typeof m !== 'object') return;
  switch (m.t){
    case 'set': { if (!Array.isArray(m.items)) return; const list = m.items.slice(0, 500).map(clean).filter(Boolean).filter(i => !(D && D.id === i.id)); put(list, false); m = { t:'set', items:list }; break; }
    case 'del': { if (!Array.isArray(m.ids)) return; const ids = m.ids.slice(0, 500).map(String); drop(ids, false); m = { t:'del', ids }; break; }
    case 'state': if (NET.host || !m.items || typeof m.items !== 'object') return; loadAll(Object.values(m.items)); undoS = []; redoS = []; undoBtns(); toast('Connected. You are both in the same world now.'); setView('fit'); return;
    case 'hello': {
      const id = String(m.id || '').slice(0, 40); if (!/^[\w-]+$/.test(id) || id === ME.id) return;
      const known = peers[id]; peers[id] = { name:String(m.name || 'Partner').slice(0, 20), color:/^#[0-9a-f]{6}$/i.test(m.color) ? m.color : '#64748b' };
      if (NET.host && !c._who) c._who = id;
      if (!known) toast(`${peers[id].name} joined.`);
      netStatus(); if (dlg.open && dlg._together) showTogether();
      m = { t:'hello', id, name:peers[id].name, color:peers[id].color }; break;
    }
    case 'bye': { const id = String(m.id || ''); if (peers[id]){ toast(`${peers[id].name} left.`); delete peers[id]; netStatus(); } break; }
    default: return;
  }
  if (NET.host) bcast(m, c);
}
function netStatus(){
  const b = $('#togetherBtn'), l = $('#togetherLbl'), n = Object.keys(peers).length;
  if (NET.state === 'off'){ l.textContent = 'Work together'; b.classList.add('primary'); }
  else { b.classList.remove('primary'); l.textContent = NET.state === 'live' && n ? `Together · ${n + 1}` : NET.state === 'waiting' ? `Code ${NET.code}` : 'Connecting…'; }
}
function showTogether(){
  dlg._together = true;
  const names = [`<span class="person"><span class="dot" style="color:${ME.color}"></span>${esc(myName())} (you)</span>`].concat(Object.values(peers).map(p => `<span class="person"><span class="dot" style="color:${p.color}"></span>${esc(p.name)}</span>`)).join('');
  const nameRow = `<label for="myName">Your name</label><input id="myName" name="name" maxlength="20" value="${esc(ME.name)}" placeholder="For example: Ana" autocomplete="off">`;
  const setName = fd => { ME.name = String(fd.get('name') || '').trim().slice(0, 20); ls.set('l3d-name', ME.name); };
  if (NET.state === 'off'){
    openDlg(`<h2>Work together</h2><p>Two or more people move pieces in the same 3D world, each on their own device and with their own camera. No accounts needed.</p>${nameRow}
      <div class="two"><section><h3>Start a shared world</h3><p>Share the world you have now and get a code.</p><button class="btn primary" value="host">Start</button></section>
      <section><h3>Join a partner</h3><p>Type your partner's code. Their world will replace yours.</p><input name="code" maxlength="7" placeholder="Code" autocomplete="off" aria-label="Partner's code" style="text-transform:uppercase;letter-spacing:.12em;font-weight:700"><button class="btn" value="join">Join</button></section></div>
      <menu><button class="btn" value="cancel">Close</button></menu>`,
      (v, fd) => { setName(fd); if (v === 'host'){ startHost(); setTimeout(showTogether, 0); return false; } if (v === 'join') join(fd.get('code')); });
  } else {
    const link = baseUrl(); link.searchParams.set('join', NET.code);
    openDlg(`<h2>${NET.host ? 'Your shared world' : 'Working together'}</h2>
      ${NET.host && NET.state !== 'starting' ? `<p>Your partner clicks <b>Work together</b> and types this code:</p><div class="code">${NET.code}</div><label for="joinLink">Or send this link</label><div class="row"><input id="joinLink" readonly value="${esc(link.toString())}"><button type="button" class="btn" data-copy="#joinLink" style="flex:0 0 auto">Copy</button></div>` : NET.state === 'starting' ? '<p>Getting a code…</p>' : ''}
      <div class="people">${names}</div>${nameRow}
      <menu><button class="btn" value="rename">Save name</button><button class="btn" value="leave">${NET.host ? 'Stop sharing' : 'Leave'}</button><button class="btn primary" value="cancel">Done</button></menu>`,
      (v, fd) => { if (v === 'leave'){ leave(); return; } if (v === 'rename'){ setName(fd); bcast({ t:'hello', id:ME.id, name:myName(), color:ME.color }); toast('Name saved.'); setTimeout(showTogether, 0); return false; } });
  }
}
$('#togetherBtn').onclick = showTogether;
function joinPrompt(code){
  dlg._together = true;
  openDlg(`<h2>Join a shared world</h2><p>You are joining the world <b>${esc(code)}</b>. Your partner's world will replace yours.</p>
    <label for="joinName">Your name</label><input id="joinName" name="name" maxlength="20" value="${esc(ME.name)}" placeholder="For example: Ana" autocomplete="off" autofocus>
    <menu><button class="btn primary" value="join">Join</button><button class="btn" value="cancel">Not now</button></menu>`,
    (v, fd) => { if (v !== 'join') return; ME.name = String(fd.get('name') || '').trim().slice(0, 20); ls.set('l3d-name', ME.name); join(code); });
}
window.addEventListener('beforeunload', () => { if (NET.peer) try { NET.peer.destroy(); } catch(e){} });

/* ---------- the loop and start up ---------- */
renderer.setAnimationLoop(() => {
  if (camAnim){
    const k = Math.min(1, (performance.now() - camAnim.t0)/450), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;
    camera.position.lerpVectors(camAnim.p0, camAnim.p1, e); controls.target.lerpVectors(camAnim.q0, camAnim.q1, e);
    if (k >= 1) camAnim = null;
  }
  controls.update();
  renderer.render(scene, camera);
  if (S.names) updateLabels();
});
async function boot(){
  buildTray(); syncToggles(); undoBtns(); netStatus();
  const h = location.hash.match(/[#&]w=([^&]+)/);
  let started = false;
  if (h){ try { loadAll(await decodeWorld(h[1])); started = true; } catch(e){ toast('That world link could not be opened.'); } }
  if (!started){ try { const saved = JSON.parse(ls.get('l3d-world-v1') || '[]'); if (Array.isArray(saved)) loadAll(saved); } catch(e){} }
  const j = String(params.get('join') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (j){ const u = baseUrl(); history.replaceState(null, '', u.toString() + location.hash); joinPrompt(j); }
  $('#loading').remove();
  window.__live3dReady = true;
  window.__L3D = { S, objs, solidOf, baseOf, act, put, drop, sync, setView, newItem, camera, controls, scene, renderer, stackY, blockDims };   // for testing
}
boot();
</script>
